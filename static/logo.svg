<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #000000; }
      .outline { stroke: #232238; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .ghost-body { fill: #e53935; }
      .ghost-shadow { fill: #c62828; }
      .page-bg { fill: #fcfbf7; }
      .page-crease { fill: #e2ddd3; }
      .book-cover { fill: #cf2127; }
      .headphone-band { fill: none; stroke: #e0e2ec; stroke-width: 2.8; stroke-linecap: round; }
      .headphone-outer { stroke: #232238; stroke-width: 4.8; fill: none; stroke-linecap: round; }
      .cart-fill { fill: #2c2941; }
      .wheel { fill: #e4bc84; stroke: #232238; stroke-width: 1.2; }
      .track-beam { fill: none; stroke: #e0e2ec; stroke-width: 4.5; stroke-linecap: round; }
      .track-outline { fill: none; stroke: #232238; stroke-width: 7; stroke-linecap: round; }
      .sleeper { stroke: #232238; stroke-width: 2.2; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Background circle (optional/transparent or dark matching artwork) -->
  <rect width="100" height="100" fill="#000000" rx="16"/>

  <g transform="translate(0, 1)">
    <!-- BOOK BASE -->
    <!-- Red Cover / Back Edge -->
    <path class="outline" style="fill:#cf2127; stroke:#232238; stroke-width:3.8;" d="M 18,50 L 50,78 L 82,68 L 80,62 L 50,71 L 20,44 Z" />
    
    <!-- Open Pages Left & Right -->
    <path class="outline" style="fill:#fcfbf7;" d="M 24,45 C 33,48 42,50 50,71 C 42,52 32,49 21,46 Z" />
    <path class="outline" style="fill:#fcfbf7;" d="M 50,71 C 58,52 69,53 78,61 L 79,64 C 68,55 58,55 50,73 Z" />
    <!-- Main open page block -->
    <polygon class="outline" style="fill:#ffffff;" points="25,44 49,60 49,71 22,48" />
    <polygon class="outline" style="fill:#ffffff;" points="51,60 76,51 78,61 51,71" />
    
    <!-- Spine bookmark detail -->
    <line x1="50" y1="64" x2="50" y2="73" stroke="#232238" stroke-width="2.5" stroke-linecap="round"/>

    <!-- TRACK / ROLLERCOASTER S-CURVE -->
    <!-- Background track arch -->
    <path class="track-outline" d="M 64,29 C 75,32 79,42 70,55 C 62,64 45,63 35,66" />
    <path class="track-beam" d="M 64,29 C 75,32 79,42 70,55 C 62,64 45,63 35,66" />

    <!-- Track sleepers / ties -->
    <line class="sleeper" x1="64" y1="28" x2="68" y2="33" />
    <line class="sleeper" x1="69" y1="32" x2="74" y2="38" />
    <line class="sleeper" x1="72" y1="39" x2="78" y2="44" />
    <line class="sleeper" x1="71" y1="47" x2="76" y2="52" />
    <line class="sleeper" x1="64" y1="53" x2="68" y2="59" />
    <line class="sleeper" x1="55" y1="57" x2="57" y2="63" />
    <line class="sleeper" x1="45" y1="60" x2="46" y2="66" />
    <line class="sleeper" x1="36" y1="62" x2="36" y2="68" />

    <!-- MINING CART -->
    <g transform="translate(1,0)">
      <polygon class="outline" style="fill:#2c2941; stroke-width:2.4;" points="56,48 68,48 67,56 58,57" />
      <circle cx="60" cy="58" r="2.2" class="wheel" />
      <circle cx="65" cy="57" r="2.2" class="wheel" />
    </g>

    <!-- GHOST -->
    <!-- Headphone Band (outer border & inner line) -->
    <path class="headphone-outer" d="M 39,29 C 39,18 61,18 61,29" />
    <path class="headphone-band" d="M 39,29 C 39,18 61,18 61,29" />

    <!-- Ghost Body -->
    <path class="outline ghost-body" style="stroke-width:3.2;" d="M 40,31 C 40,22 60,22 60,31 C 60,38 61,40 64,38 C 62,43 56,43 56,41 C 53,52 42,56 31,48 C 42,53 45,43 44,41 C 44,43 38,43 36,38 C 39,40 40,38 40,31 Z" />
    
    <!-- Ghost Eyes -->
    <circle cx="47" cy="31" r="2.1" fill="#232238" />
    <circle cx="54" cy="31" r="2.1" fill="#232238" />

    <!-- Headphone Ear Cups -->
    <rect class="outline" style="fill:#e53935; stroke-width:2.6;" x="37" y="27" width="4.5" height="9" rx="2.2" />
    <rect class="outline" style="fill:#e53935; stroke-width:2.6;" x="58.5" y="27" width="4.5" height="9" rx="2.2" />
  </g>
</svg>
