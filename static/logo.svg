<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Open Book Base -->
  <g id="book">
    <!-- Outer Cover Backing (Dark Crimson / Navy Shadow) -->
    <path d="M 85 248 L 115 352 Q 256 422 256 390 Q 256 422 397 352 L 427 248 Q 256 322 256 290 Q 256 322 85 248 Z" fill="#2d1c2e" stroke="#252438" stroke-width="14" stroke-linejoin="round" />
    
    <!-- Cover Border Red Accent -->
    <path d="M 96 258 L 120 354 Q 256 414 256 385 Q 256 414 392 354 L 416 258 Q 256 318 256 288 Q 256 318 96 258 Z" fill="#e23c39" stroke="#252438" stroke-width="12" stroke-linejoin="round" />

    <!-- Book Pages (Open Spread, White / Ivory) -->
    <path d="M 120 220 L 132 328 Q 256 376 256 360 Q 256 376 380 328 L 392 220 Q 256 268 256 254 Q 256 268 120 220 Z" fill="#fdfbf7" stroke="#252438" stroke-width="14" stroke-linejoin="round" />
    
    <!-- Page Edges / Paper thickness -->
    <path d="M 132 328 Q 256 376 256 360 Q 256 376 380 328" fill="none" stroke="#e8ded1" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Spine Centerfold Line -->
    <line x1="256" y1="256" x2="256" y2="366" stroke="#252438" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Curved Rollercoaster / Train Tracks looping out of the book -->
  <g id="rail-track">
    <!-- Wooden Ties / Slats -->
    <!-- Lower curve running across the book -->
    <path d="M 178 335 L 186 310" stroke="#252438" stroke-width="11" stroke-linecap="round" />
    <path d="M 208 322 L 218 298" stroke="#252438" stroke-width="11" stroke-linecap="round" />
    <path d="M 240 310 L 252 288" stroke="#252438" stroke-width="11" stroke-linecap="round" />
    <path d="M 274 298 L 290 278" stroke="#252438" stroke-width="11" stroke-linecap="round" />

    <!-- Loop going up and around to the right -->
    <path d="M 345 235 L 375 238" stroke="#252438" stroke-width="11" stroke-linecap="round" />
    <path d="M 358 195 L 388 205" stroke="#252438" stroke-width="11" stroke-linecap="round" />
    <path d="M 352 155 L 378 172" stroke="#252438" stroke-width="11" stroke-linecap="round" />

    <!-- Two Rail Lines -->
    <!-- Left / Inner Rail -->
    <path d="M 170 338 C 220 315 285 285 348 248 C 362 230 368 185 330 148" fill="none" stroke="#252438" stroke-width="12" stroke-linecap="round" />
    <!-- Right / Outer Rail -->
    <path d="M 188 312 C 238 290 305 260 382 245 C 405 220 405 175 365 140" fill="none" stroke="#252438" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Minecart / Train Wagon -->
  <g id="cart">
    <!-- Cart Body -->
    <path d="M 285 264 L 338 244 L 348 274 L 295 294 Z" fill="#2d3142" stroke="#252438" stroke-width="10" stroke-linejoin="round" />
    <path d="M 292 268 L 334 252" stroke="#e23c39" stroke-width="5" stroke-linecap="round" />
    
    <!-- Wheels -->
    <circle cx="308" cy="296" r="8" fill="#d9b48f" stroke="#252438" stroke-width="7" />
    <circle cx="338" cy="284" r="8" fill="#d9b48f" stroke="#252438" stroke-width="7" />
  </g>

  <!-- Phantom / Ghost Character -->
  <g id="ghost">
    <!-- Headphones Arc -->
    <path d="M 204 154 C 204 100 308 100 308 154" fill="none" stroke="#252438" stroke-width="32" stroke-linecap="round" />
    <path d="M 204 154 C 204 108 308 108 308 154" fill="none" stroke="#fdfbf7" stroke-width="14" stroke-linecap="round" />

    <!-- Headphones Ear Pads -->
    <rect x="190" y="132" width="22" height="38" rx="10" fill="#e23c39" stroke="#252438" stroke-width="10" />
    <rect x="300" y="132" width="22" height="38" rx="10" fill="#e23c39" stroke="#252438" stroke-width="10" />

    <!-- Ghost Body Outer Stroke & Fill -->
    <!-- Rounded head, left arm, right arm, swooping ghostly tail -->
    <path d="M 220 180 
             C 214 136 298 136 292 180
             C 294 186 312 184 322 188
             C 318 198 302 208 288 206
             C 280 236 230 274 165 254
             C 230 252 240 220 224 206
             C 210 208 194 198 190 188
             C 200 184 218 186 220 180 Z" 
          fill="#e23c39" stroke="#252438" stroke-width="13" stroke-linejoin="round" />

    <!-- Ghost Eyes -->
    <circle cx="240" cy="160" r="7.5" fill="#252438" />
    <circle cx="272" cy="160" r="7.5" fill="#252438" />
  </g>
</svg>