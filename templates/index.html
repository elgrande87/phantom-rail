<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiobook & M4B Creator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        h1, h2, h3 {
            margin-top: 0;
            color: var(--primary);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        input[type="text"], input[type="url"], textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .cover-preview-wrapper {
            display: flex;
            justify-content: center;
            margin: 12px 0;
        }

        .cover-preview {
            max-width: 220px;
            max-height: 220px;
            width: auto;
            height: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
            object-fit: contain;
            background-color: #000;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .chapter-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .chapter-num {
            min-width: 32px;
            text-align: center;
            font-weight: bold;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .chapter-item input {
            flex-grow: 1;
            padding: 8px;
            font-size: 0.95rem;
            background-color: #1e293b;
            border: 1px solid var(--border);
        }

        .batch-toolbar {
            background: #0b1329;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .batch-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 0.85rem;
            width: auto;
            background-color: #334155;
            color: var(--text-main);
        }

        .btn-small:hover {
            background-color: #475569;
        }

        .progress-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .progress-bar-container {
            width: 100%;
            height: 12px;
            background-color: #0f172a;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        #logOutput {
            background-color: #000;
            color: #38bdf8;
            font-family: monospace;
            font-size: 0.85rem;
            padding: 12px;
            border-radius: 8px;
            height: 160px;
            overflow-y: auto;
            white-space: pre-wrap;
            border: 1px solid var(--border);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Audiobook & M4B Creator</h1>
        <div class="input-group">
            <label for="urlInput">URL (YouTube / Playlist / SoundCloud)</label>
            <input type="url" id="urlInput" placeholder="https://www.youtube.com/playlist?list=..." required>
        </div>
        <button id="inspectBtn" onclick="inspectUrl()">URL prüfen & Metadaten laden</button>
    </div>

    <div class="card" id="detailsCard" style="display: none;">
        <h2>Metadaten & Cover</h2>
        
        <div class="cover-preview-wrapper">
            <img id="coverPreview" class="cover-preview" src="" alt="Cover Preview">
        </div>

        <div class="input-group">
            <label for="coverUrlInput">Cover Bild URL</label>
            <input type="text" id="coverUrlInput" oninput="updateCoverPreview()">
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label for="titleInput">Titel / Hörbuchname</label>
                <input type="text" id="titleInput">
            </div>
            <div class="input-group">
                <label for="authorInput">Autor / Sprecher</label>
                <input type="text" id="authorInput">
            </div>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label for="seriesInput">Serie / Reihe</label>
                <input type="text" id="seriesInput">
            </div>
            <div class="input-group">
                <label for="yearInput">Erscheinungsjahr</label>
                <input type="text" id="yearInput">
            </div>
        </div>

        <div class="input-group">
            <label for="descInput">Beschreibung</label>
            <textarea id="descInput" rows="3"></textarea>
        </div>

        <h3 id="chStatusLabel" style="margin-top: 20px;">Kapitelübersicht:</h3>

        <div class="batch-toolbar">
            <div style="font-size: 0.85rem; font-weight: bold; color: var(--primary);">
                Werkzeug: Kapitelnamen gleichzeitig bearbeiten
            </div>
            <div class="batch-row">
                <input type="text" id="batchFind" placeholder="Text suchen / entfernen (z. B. ': Zahlen, bitte!')" style="flex: 2; padding: 8px;">
                <input type="text" id="batchReplace" placeholder="Ersetzen durch (leer lassen = löschen)" style="flex: 2; padding: 8px;">
                <button type="button" class="btn-small" onclick="applyBatchFindReplace()">Ausführen</button>
            </div>
            <div class="batch-row">
                <button type="button" class="btn-small" onclick="removeLeadingNumbers()">🗑️ 'Kapitel 1:' / 'Track 1' entfernen</button>
                <button type="button" class="btn-small" onclick="addLeadingNumbers()">🔢 'Kapitel 1: ...' voranstellen</button>
                <button type="button" class="btn-small" onclick="resetChaptersToCleaned()">↺ Zurücksetzen</button>
            </div>
        </div>

        <div id="chapterList"></div>

        <button id="downloadBtn" onclick="startDownload()" style="margin-top: 16px;">
            M4B Hörbuch herunterladen & erstellen
        </button>
    </div>

    <div class="card" id="progressCard" style="display: none;">
        <h2>Fortschritt</h2>

        <div class="progress-box">
            <div class="progress-label">
                <span>1. Download-Fortschritt</span>
                <span id="dlPercent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div id="dlBar" class="progress-bar"></div>
            </div>
        </div>

        <div class="progress-box" style="margin-top: 12px;">
            <div class="progress-label">
                <span>2. M4B Zusammenfügen & Kapitel schreiben</span>
                <span id="procPercent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div id="procBar" class="progress-bar" style="background-color: var(--success);"></div>
            </div>
        </div>

        <div id="logOutput">Warte auf Server-Rückmeldung...</div>
    </div>
</div>

<script>
    let globalChapters = [];
    let initialCleanedChapters = [];

    function updateCoverPreview() {
        const url = document.getElementById('coverUrlInput').value;
        document.getElementById('coverPreview').src = url;
    }

    function cleanChapterName(rawName, bookTitle, bookSeries) {
        if (!rawName) return "Kapitel";
        let s = rawName;
        s = s.replace(/[\(\[\{].*?(hörspiel|audiobook|ungekürzt|komplett|full).*?[\)\]\}]/gi, '');
        s = s.replace(/\s*\|\s*.*$/g, '');
        if (bookTitle && bookTitle.length > 3) {
            const escTitle = bookTitle.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            s = s.replace(new RegExp(escTitle, 'gi'), '');
        }
        if (bookSeries && bookSeries.length > 3) {
            const escSeries = bookSeries.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            s = s.replace(new RegExp(escSeries, 'gi'), '');
        }
        s = s.replace(/^[\s\-_:–—]+/, '').replace(/[\s\-_:–—]+$/, '');
        s = s.replace(/\s{2,}/g, ' ');
        return s.trim() || rawName.trim();
    }

    async function inspectUrl() {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) {
            alert("Bitte gib eine URL ein.");
            return;
        }

        const btn = document.getElementById('inspectBtn');
        btn.disabled = true;
        btn.innerText = "Prüfe URL & Metadaten...";

        try {
            const res = await fetch('/inspect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Fehler beim Laden");

            document.getElementById('titleInput').value = data.title || "";
            document.getElementById('authorInput').value = data.author || "";
            document.getElementById('seriesInput').value = data.series || "";
            document.getElementById('yearInput').value = data.year || "";
            document.getElementById('descInput').value = data.description || "";
            document.getElementById('coverUrlInput').value = data.thumbnail || "";
            document.getElementById('coverPreview').src = data.thumbnail || "";

            const audChapters = data.audible_chapters || [];
            console.log("=== [Audnexus / Audible] Roh-Kapitel ===", audChapters);

            const chList = document.getElementById('chapterList');
            chList.innerHTML = "";
            const useAudibleCh = (audChapters.length === data.chapters.length && audChapters.length > 0);

            document.getElementById('chStatusLabel').innerText = useAudibleCh
                ? "Kapitelübersicht (von Audible übernommen & bereinigt):"
                : "Kapitelübersicht:";

            globalChapters = [];
            initialCleanedChapters = [];

            data.chapters.forEach((ch, i) => {
                const rawName = useAudibleCh ? audChapters[i] : (ch.title || ch.original);
                const cleaned = cleanChapterName(rawName, data.title, data.series);

                initialCleanedChapters.push(cleaned);

                const row = document.createElement('div');
                row.className = 'chapter-item';
                row.innerHTML = `
                    <span class="chapter-num">${i + 1}</span>
                    <input type="text" class="chapter-input" data-index="${i}" value="${cleaned.replace(/"/g, '&quot;')}">
                `;
                chList.appendChild(row);
            });

            document.getElementById('detailsCard').style.display = "block";
            document.getElementById('detailsCard').scrollIntoView({ behavior: 'smooth' });

        } catch (err) {
            alert("Fehler: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "URL prüfen & Metadaten laden";
        }
    }

    function applyBatchFindReplace() {
        const findVal = document.getElementById('batchFind').value;
        const replaceVal = document.getElementById('batchReplace').value;
        if (!findVal) return;

        const inputs = document.querySelectorAll('.chapter-input');
        inputs.forEach(input => {
            input.value = input.value.split(findVal).join(replaceVal).trim();
        });
    }

    function removeLeadingNumbers() {
        const pattern = /^(kapitel|track|folge|teil|part)?\s*\d+[\s\.\-_:–—]*/i;
        const inputs = document.querySelectorAll('.chapter-input');
        inputs.forEach(input => {
            input.value = input.value.replace(pattern, '').trim();
        });
    }

    function addLeadingNumbers() {
        const inputs = document.querySelectorAll('.chapter-input');
        inputs.forEach((input, index) => {
            const clean = input.value.replace(/^(kapitel|track|folge|teil|part)?\s*\d+[\s\.\-_:–—]*/i, '').trim();
            input.value = `Kapitel ${index + 1}: ${clean}`;
        });
    }

    function resetChaptersToCleaned() {
        const inputs = document.querySelectorAll('.chapter-input');
        inputs.forEach((input, index) => {
            if (initialCleanedChapters[index] !== undefined) {
                input.value = initialCleanedChapters[index];
            }
        });
    }

    function startDownload() {
        const url = document.getElementById('urlInput').value.trim();
        const inputs = document.querySelectorAll('.chapter-input');
        const finalChapters = Array.from(inputs).map(inp => inp.value.trim());

        const payload = {
            url: url,
            title: document.getElementById('titleInput').value.trim(),
            author: document.getElementById('authorInput').value.trim(),
            series: document.getElementById('seriesInput').value.trim(),
            year: document.getElementById('yearInput').value.trim(),
            description: document.getElementById('descInput').value.trim(),
            cover_url: document.getElementById('coverUrlInput').value.trim(),
            chapter_names: finalChapters
        };

        document.getElementById('downloadBtn').disabled = true;
        document.getElementById('progressCard').style.display = "block";
        document.getElementById('progressCard').scrollIntoView({ behavior: 'smooth' });

        const log = document.getElementById('logOutput');
        log.textContent = "Starte Download & M4B Generierung...\n";

        fetch('/process', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(response => {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            function read() {
                reader.read().then(({ done, value }) => {
                    if (done) {
                        document.getElementById('downloadBtn').disabled = false;
                        return;
                    }
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    lines.forEach(line => {
                        if (line.startsWith('data: ')) {
                            try {
                                const msg = JSON.parse(line.substring(6));
                                handleServerMessage(msg);
                            } catch (e) {}
                        }
                    });
                    read();
                });
            }
            read();
        }).catch(err => {
            log.textContent += "\nVerbindungsfehler: " + err.message;
            document.getElementById('downloadBtn').disabled = false;
        });
    }

    function handleServerMessage(msg) {
        const log = document.getElementById('logOutput');
        if (typeof msg === 'string') {
            log.textContent += msg + "\n";
            log.scrollTop = log.scrollHeight;
            return;
        }

        if (msg.type === 'dl_progress') {
            const pct = Math.min(100, Math.max(0, Math.round(msg.percent)));
            document.getElementById('dlBar').style.width = pct + "%";
            document.getElementById('dlPercent').innerText = pct + "%";
        } else if (msg.type === 'proc_progress') {
            const pct = Math.min(100, Math.max(0, Math.round(msg.percent)));
            document.getElementById('procBar').style.width = pct + "%";
            document.getElementById('procPercent').innerText = pct + "%";
        } else if (msg.type === 'log') {
            log.textContent += msg.message + "\n";
            log.scrollTop = log.scrollHeight;
        }
    }
</script>

</body>
</html>
