<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>phantom-rail | Audiobook & M4B Creator</title>
<link rel="icon" type="image/svg+xml" href="/static/pasted.svg">
<style>
:root{--bg-color:#0f172a;--card-bg:#1e293b;--primary:#38bdf8;--primary-hover:#0284c7;--text-main:#f8fafc;--text-muted:#94a3b8;--border:#334155;--success:#22c55e;--danger:#ef4444}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg-color);color:var(--text-main);margin:0;padding:16px;display:flex;justify-content:center}.container{width:100%;max-width:800px;display:flex;flex-direction:column;gap:16px}.card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 4px 6px -1px rgba(0,0,0,.3)}.header-title{display:flex;align-items:center;gap:14px;margin-bottom:8px}.brand-logo{width:52px;height:52px;object-fit:contain;border-radius:8px;flex-shrink:0}.brand-text{display:flex;flex-direction:column;gap:2px}.brand-name{font-size:1.8rem;font-weight:800;letter-spacing:-.02em;color:var(--primary)}.brand-subtitle{font-size:.95rem;color:var(--text-muted);font-weight:500}h1,h2,h3{margin-top:0;color:var(--primary)}.input-group{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}label{font-size:.85rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}input[type="text"],input[type="url"],textarea{width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:#0f172a;color:var(--text-main);font-size:1rem;box-sizing:border-box}input:focus,textarea:focus{outline:none;border-color:var(--primary)}button{background:var(--primary);color:#0f172a;border:none;border-radius:8px;padding:12px 18px;font-size:1rem;font-weight:bold;cursor:pointer;width:100%}button:hover{background:var(--primary-hover)}button:disabled{background:var(--border);color:var(--text-muted);cursor:not-allowed}.cover-preview-wrapper{display:flex;justify-content:center;margin:12px 0}.cover-preview{max-width:220px;max-height:220px;width:auto;height:auto;border-radius:8px;border:1px solid var(--border);object-fit:contain;background:#000}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid-2{grid-template-columns:1fr}}.chapter-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:#0f172a;padding:8px;border-radius:6px;border:1px solid var(--border)}.chapter-num{min-width:32px;text-align:center;font-weight:bold;color:var(--text-muted);font-size:.85rem}.chapter-item input{flex-grow:1;padding:8px;font-size:.95rem;background:#1e293b;border:1px solid var(--border)}.batch-toolbar{background:#0b1329;border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}.batch-row{display:flex;gap:8px;flex-wrap:wrap}.btn-small{padding:8px 12px;font-size:.85rem;width:auto;background:#334155;color:var(--text-main)}.btn-small:hover{background:#475569}.progress-box{display:flex;flex-direction:column;gap:8px;margin-top:12px}.progress-bar-container{width:100%;height:12px;background:#0f172a;border-radius:6px;overflow:hidden;border:1px solid var(--border)}.progress-bar{height:100%;width:0%;background:var(--primary);transition:width .3s ease}.progress-label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--text-muted)}#logOutput{background:#000;color:#38bdf8;font-family:monospace;font-size:.85rem;padding:12px;border-radius:8px;height:160px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;border:1px solid var(--border);margin-top:10px}.log-line{line-height:1.45;margin-bottom:2px}.log-line.error{color:var(--danger);font-weight:bold}.log-line.done{color:var(--success);font-weight:bold}

/* === ORDNER-REITER (TABS) & iOS OPTIMIERUNG === */
#folderTabs, #folder-tabs, .folder-tabs {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 8px !important;
    max-height: 220px;
    overflow-y: auto;
    padding: 10px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid #334155;
    border-radius: 10px;
    margin-bottom: 12px;
    -webkit-overflow-scrolling: touch;
}

button.folder-tab, .folder-tab {
    width: auto !important;
    flex: 0 1 auto !important;
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    padding: 8px 14px !important;
    margin: 0 !important;
    font-size: 14px !important;
    font-weight: 500 !important;
    border-radius: 20px !important;
    background-color: #1e293b !important;
    color: #cbd5e1 !important;
    border: 1px solid #475569 !important;
    cursor: pointer;
    transition: all 0.15s ease-in-out;
    min-height: 38px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

button.folder-tab:hover, .folder-tab:hover {
    background-color: #334155 !important;
    color: #f8fafc !important;
    border-color: #64748b !important;
}

/* Ausgewählter Reiter setzt sich deutlich farbig ab (Grün/Türkis) */
button.folder-tab.active, .folder-tab.active {
    background-color: #10b981 !important;
    color: #06281e !important;
    border-color: #34d399 !important;
    font-weight: 700 !important;
    box-shadow: 0 0 10px rgba(16, 185, 129, 0.4) !important;
    transform: scale(1.02);
}

button.folder-tab.active::before, .folder-tab.active::before {
    content: "✓ ";
    font-weight: bold;
    margin-right: 4px;
}

/* iOS Safari Optimierungen (verhindert Auto-Zoom bei Eingabefeldern & verbessert Layout) */
@media screen and (max-width: 768px) {
    input[type="text"], input[type="url"], select, textarea {
        font-size: 16px !important;
    }
    .container, main, body > div {
        padding-left: 12px !important;
        padding-right: 12px !important;
    }
    button.folder-tab, .folder-tab {
        padding: 10px 14px !important;
        font-size: 14px !important;
    }
}


        .sys-status-badge {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all 0.25s ease;
            border: 1px solid rgba(56, 189, 248, 0.4);
            background: rgba(15, 23, 42, 0.85);
            color: #38bdf8;
            white-space: nowrap;
        }
        .sys-status-badge:hover {
            transform: translateY(-1px);
            filter: brightness(1.15);
        }
        .sys-status-badge.up_to_date {
            border-color: rgba(34, 197, 94, 0.5);
            background: rgba(20, 83, 45, 0.4);
            color: #4ade80;
        }
        .sys-status-badge.warning {
            border-color: rgba(245, 158, 11, 0.5);
            background: rgba(120, 53, 15, 0.4);
            color: #fbbf24;
        }
        .sys-spin {
            animation: sysRotate 1.1s linear infinite;
        }
        @keyframes sysRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

    </style>

<style id="sysStatusCustomStyle">
.sys-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 9999px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
    transition: all 0.2s ease;
    user-select: none;
}
.sys-status-badge:hover {
    filter: brightness(1.15);
}
.sys-status-badge.up_to_date {
    background: rgba(16, 185, 129, 0.15) !important;
    color: #34d399 !important;
    border-color: rgba(16, 185, 129, 0.4) !important;
}
.sys-status-badge.warning {
    background: rgba(245, 158, 11, 0.15) !important;
    color: #fbbf24 !important;
    border-color: rgba(245, 158, 11, 0.4) !important;
}
.sys-status-badge.error {
    background: rgba(239, 68, 68, 0.15) !important;
    color: #f87171 !important;
    border-color: rgba(239, 68, 68, 0.4) !important;
}
.sys-spin svg {
    animation: sysRotate 1s linear infinite;
}
@keyframes sysRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
</style>

</head>
<body>
<div class="container">
<div class="card">
<div class="header-title" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <div style="display:flex; align-items:center; gap:14px;">
        <img src="/static/pasted.svg" alt="phantom-rail Logo" class="brand-logo">
        <div class="brand-text">
            <span class="brand-name">phantom-rail</span>
            <span class="brand-subtitle">Audiobook & M4B Chapter Binder</span>
        </div>
    </div>
    <div id="sysStatusBadge" class="sys-status-badge" onclick="triggerSystemCheck()" title="Klicken für Update-Prüfung" style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:9999px; font-size:0.8rem; font-weight:600; cursor:pointer; background:#1e293b; color:#38bdf8; border:1px solid #334155; margin-left:auto;">
        <span id="sysStatusIcon" class="sys-spin"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span>
        <span id="sysStatusText">System: Bereit</span>
    </div>
</div>
<div class="input-group" style="margin-top:14px"><label for="urlInput">URL (YouTube / Playlist / SoundCloud)</label><input type="url" id="urlInput" placeholder="https://www.youtube.com/playlist?list=..." required></div>
<button id="inspectBtn" onclick="inspectUrl()">URL prüfen & Metadaten laden</button>
</div>
<div class="card" id="detailsCard" style="display:none">
<h2>Metadaten & Cover</h2>
<div class="cover-preview-wrapper"><img id="coverPreview" class="cover-preview" src="" alt="Cover Preview"></div>
<div class="input-group"><label for="coverUrlInput">Cover Bild URL</label><input type="text" id="coverUrlInput" oninput="updateCoverPreview()"></div>
<div class="input-group"><label for="titleInput">Titel / Hörbuchname</label><input type="text" id="titleInput"><button type="button" id="lookupMetaBtn" class="btn-small" style="margin-top:8px">Audible Metadaten suchen</button><span id="metaLookupStatus" role="status"></span></div><div class="grid-2"><div class="input-group"><label for="authorInput">Autor</label><input type="text" id="authorInput"></div><div class="input-group"><label for="narratorInput">Sprecher / Narrator</label><input type="text" id="narratorInput"></div></div>
<div class="grid-2"><div class="input-group"><label for="seriesInput">Serie / Reihe</label><input type="text" id="seriesInput"></div><div class="input-group"><label for="yearInput">Erscheinungsjahr</label><input type="text" id="yearInput"></div></div>
<div class="input-group"><label for="descInput">Beschreibung</label><textarea id="descInput" rows="3"></textarea></div>
<h3 id="chStatusLabel" style="margin-top:20px">Kapitelübersicht:</h3>
<div class="batch-toolbar"><div style="font-size:.85rem;font-weight:bold;color:var(--primary)">Werkzeug: Kapitelnamen gleichzeitig bearbeiten</div>
<div class="batch-row"><input type="text" id="batchFind" placeholder="Text suchen / entfernen" style="flex:2;padding:8px"><input type="text" id="batchReplace" placeholder="Ersetzen durch (leer = löschen)" style="flex:2;padding:8px"><button type="button" class="btn-small" onclick="applyBatchFindReplace()">Ausführen</button></div>
<div class="batch-row"><button type="button" class="btn-small" onclick="removeLeadingNumbers()">🗑️ 'Kapitel 1:' / 'Track 1' entfernen</button><button type="button" class="btn-small" onclick="addLeadingNumbers()">🔢 'Kapitel 1: ...' voranstellen</button><button type="button" class="btn-small" onclick="resetChaptersToCleaned()">↺ Zurücksetzen</button></div></div>
<div id="chapterList"></div><button id="downloadBtn" onclick="startDownload()" style="margin-top:16px">M4B Hörbuch herunterladen & erstellen</button>
</div>
<div class="card" id="progressCard" style="display:none"><h2>Fortschritt</h2>
<div class="progress-box"><div class="progress-label"><span id="dlStatusLabel">1. Download-Fortschritt (Gesamtes Buch)</span><span id="dlPercent">0%</span></div><div class="progress-bar-container"><div id="dlBar" class="progress-bar"></div></div></div>
<div class="progress-box" style="margin-top:12px"><div class="progress-label"><span>2. M4B Zusammenfügen & Kapitel schreiben</span><span id="procPercent">0%</span></div><div class="progress-bar-container"><div id="procBar" class="progress-bar" style="background:var(--success)"></div></div></div><div id="logOutput">Warte auf Server-Rückmeldung...</div></div>
</div>
<script>
let globalChapters = [];
let globalIsPlaylist = false;
let inspectedUrl = '';
let initialCleanedChapters = [];
let activeStreamController = null;
let reconnectingTimer = null;

function updateCoverPreview() {
    document.getElementById('coverPreview').src = document.getElementById('coverUrlInput').value;
}
function cleanChapterName(rawName, bookTitle, bookSeries) {
    if (!rawName) return 'Kapitel';
    let s = String(rawName);
    s = s.replace(/[\(\[\{][^\(\[\{\)\]\}]*?(hörspiel|audiobook|ungekürzt|komplett|full)[^\(\[\{\)\]\}]*[\)\]\}]/gi, '');
    s = s.replace(/\s*\|\s*.*$/g, '');
    for (const name of [bookTitle, bookSeries]) {
        if (name && name.length > 3) {
            const escaped = name.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            s = s.replace(new RegExp(escaped, 'gi'), '');
        }
    }
    s = s.replace(/^[\s\-_:–—]+/, '').replace(/[\s\-_:–—]+$/, '').replace(/\s{2,}/g, ' ');
    return s.trim() || String(rawName).trim();
}
document.getElementById('lookupMetaBtn').addEventListener('click', async function() {
    const status = document.getElementById('metaLookupStatus');
    const query = document.getElementById('titleInput').value.trim();
    if (!query) { status.textContent = 'Bitte zuerst einen Titel eingeben.'; return; }
    this.disabled = true; status.textContent = 'Suche bei Audible …';
    try {
        const response = await fetch('/lookup-meta', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Metadatenabfrage fehlgeschlagen');
        if (!data.found) { status.textContent = 'Keine passenden Audible-Metadaten gefunden.'; return; }
        for (const [id, key] of [['titleInput','title'],['authorInput','author'],['narratorInput','narrator'],['seriesInput','series'],['yearInput','year'],['descInput','description']]) {
            if (data[key]) document.getElementById(id).value = data[key];
        }
        if (data.cover) { document.getElementById('coverUrlInput').value = data.cover; updateCoverPreview(); }
        status.textContent = 'Audible-Metadaten übernommen.';
    } catch (error) { status.textContent = error.message; }
    finally { this.disabled = false; }
});

    
    let pollInterval = null;

    function updateSystemBadge(data) {
        const badge = document.getElementById('sysStatusBadge');
        const icon = document.getElementById('sysStatusIcon');
        const text = document.getElementById('sysStatusText');
        if (!badge || !icon || !text) return;

        icon.classList.remove('sys-spin');
        badge.classList.remove('up_to_date', 'warning', 'error');

        if (data.state === 'checking') {
            icon.classList.add('sys-spin');
            icon.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';
            text.textContent = 'Prüfe...';
        } else if (data.state === 'up_to_date') {
            badge.classList.add('up_to_date');
            icon.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
            text.textContent = 'yt-dlp: ' + (data.yt_dlp_version || 'aktuell');
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        } else if (data.state === 'needs_update') {
            badge.classList.add('warning');
            icon.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
            text.textContent = data.message || 'Update nötig';
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        } else {
            badge.classList.add('error');
            icon.innerHTML = '!';
            text.textContent = data.message || 'Fehler';
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        }
    }

    async function pollSystemStatus() {
        try {
            const res = await fetch('/system_status');
            if (res.ok) {
                const data = await res.json();
                updateSystemBadge(data);
            }
        } catch (e) {
            console.error("Status-Abruf fehlgeschlagen:", e);
        }
    }

    async function triggerSystemCheck() {
        const icon = document.getElementById('sysStatusIcon');
        const text = document.getElementById('sysStatusText');
        if (icon) {
            icon.classList.add('sys-spin');
            icon.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';
        }
        if (text) text.textContent = 'Prüfe...';

        try {
            const res = await fetch('/system_status?check=1', { method: 'POST' });
            if (res.ok) {
                const data = await res.json();
                updateSystemBadge(data);
            }
        } catch (e) {}

        // Nach Klick alle 1,5s abfragen bis Check beendet ist
        if (!pollInterval) {
            pollInterval = setInterval(pollSystemStatus, 1500);
        }
    }

    window.triggerSystemCheck = triggerSystemCheck;
    window.pollSystemStatus = pollSystemStatus;

    document.addEventListener('DOMContentLoaded', () => {
        pollSystemStatus();
        setInterval(pollSystemStatus, 60000);
    });

    async function inspectUrl() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) { alert('Bitte gib eine URL ein.'); return; }
    const btn = document.getElementById('inspectBtn');
    btn.disabled = true;
    btn.innerText = 'Prüfe URL & Metadaten...';
    inspectedUrl = '';
    document.getElementById('detailsCard').style.display = 'none';
    try {
        const res = await fetch('/inspect', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url})});
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Fehler beim Laden');
        globalChapters = Array.isArray(data.chapters) ? data.chapters : [];
        globalIsPlaylist = Boolean(data.is_playlist);
        for (const [id, key] of [['titleInput','title'],['authorInput','author'],['narratorInput','narrator'],['seriesInput','series'],['yearInput','year'],['descInput','description']]) {
            document.getElementById(id).value = data[key] || '';
        }
        document.getElementById('coverUrlInput').value = data.thumbnail || '';
        updateCoverPreview();
        const audible = Array.isArray(data.audible_chapters) ? data.audible_chapters : [];
        const useAudible = audible.length > 0 && audible.length === globalChapters.length;
        document.getElementById('chStatusLabel').innerText = useAudible ? 'Kapitelübersicht (von Audible übernommen & bereinigt):' : 'Kapitelübersicht:';
        const list = document.getElementById('chapterList');
        list.replaceChildren();
        initialCleanedChapters = [];
        globalChapters.forEach((ch, i) => {
            const cleaned = cleanChapterName(useAudible ? audible[i] : (ch.title || ch.original), data.title, data.series);
            initialCleanedChapters.push(cleaned);
            const row = document.createElement('div');
            row.className = 'chapter-item';
            const number = document.createElement('span');
            number.className = 'chapter-num';
            number.textContent = i + 1;
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'chapter-input';
            input.dataset.index = i;
            input.value = cleaned;
            row.append(number, input);
            list.appendChild(row);
        });
        inspectedUrl = url;
        document.getElementById('detailsCard').style.display = 'block';
        document.getElementById('detailsCard').scrollIntoView({behavior:'smooth'});
    } catch (err) { alert('Fehler: ' + err.message); }
    finally { btn.disabled = false; btn.innerText = 'URL prüfen & Metadaten laden'; }
}
function applyBatchFindReplace() {
    const find = document.getElementById('batchFind').value;
    const replacement = document.getElementById('batchReplace').value;
    if (find) document.querySelectorAll('.chapter-input').forEach(input => {input.value = input.value.split(find).join(replacement).trim();});
}
function removeLeadingNumbers() {
    document.querySelectorAll('.chapter-input').forEach(input => {input.value = input.value.replace(/^((?:kapitel|track|folge|teil|part|chapter|ch)\s*\d+[\s.\-_:–—]*|\d{1,3}\s*[.\-_:–—]+\s*)/i, '').trim();});
}
function addLeadingNumbers() {
    document.querySelectorAll('.chapter-input').forEach((input, i) => {
        const clean = input.value.replace(/^((?:kapitel|track|folge|teil|part|chapter|ch)\s*\d+[\s.\-_:–—]*|\d{1,3}\s*[.\-_:–—]+\s*)/i, '').trim();
        input.value = `Kapitel ${i + 1}: ${clean}`;
    });
}
function resetChaptersToCleaned() {
    document.querySelectorAll('.chapter-input').forEach((input, i) => {if (initialCleanedChapters[i] !== undefined) input.value = initialCleanedChapters[i];});
}
function appendLogLine(text, replaceLast = false, cssClass = '') {
    const log = document.getElementById('logOutput');
    if (replaceLast && log.lastElementChild && log.lastElementChild.dataset.replaceable === 'true') {
        log.lastElementChild.textContent = text;
        if (cssClass) log.lastElementChild.className = 'log-line ' + cssClass;
    } else {
        const line = document.createElement('div');
        line.className = 'log-line' + (cssClass ? ' ' + cssClass : '');
        line.dataset.replaceable = replaceLast ? 'true' : 'false';
        line.textContent = text;
        log.appendChild(line);
    }
    log.scrollTop = log.scrollHeight;
}

async function consumeEventStream(response) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let finished = false;
    const consume = event => {
        const data = event.split(/\r?\n/).filter(line => line.startsWith('data:')).map(line => line.slice(5).trimStart()).join('\n');
        if (!data) return;
        const msg = JSON.parse(data);
        handleServerMessage(msg);
        if (msg.status === 'error' || msg.type === 'error') {
            finished = true;
            throw new Error(msg.msg || msg.message || 'Verarbeitung fehlgeschlagen');
        }
        if (msg.status === 'done' || msg.type === 'finished') finished = true;
    };
    try {
        while (true) {
            const {done, value} = await reader.read();
            buffer += decoder.decode(value || new Uint8Array(), {stream:!done});
            const events = buffer.split(/\r?\n\r?\n/);
            buffer = events.pop();
            for (const event of events) consume(event);
            if (done) { if (buffer.trim()) consume(buffer); break; }
        }
    } finally {
        reader.releaseLock();
    }
    return finished;
}

async function attachToRunningJob(isInitialPageLoad = false) {
    if (activeStreamController) return;
    try {
        const stRes = await fetch('/job-status', {cache: 'no-store'});
        if (!stRes.ok) return;
        const st = await stRes.json();
        const isRunning = Boolean(st.running || st.active);
        const hasEvents = (typeof st.event_count === 'number') ? st.event_count > 0 : true;
        if (!isRunning && (!isInitialPageLoad || st.status === 'idle' || !hasEvents)) return;

        const button = document.getElementById('downloadBtn');
        if (button) button.disabled = Boolean(st.running);
        document.getElementById('progressCard').style.display = 'block';
        const log = document.getElementById('logOutput');
        log.replaceChildren();

        if (!st.running) {
            // Letzten abgeschlossenen/fehlgeschlagenen Job anzeigen
            activeStreamController = new AbortController();
            const response = await fetch('/job-stream', {signal: activeStreamController.signal});
            if (response.ok && response.body) {
                try { await consumeEventStream(response); } catch (err) { appendLogLine('Fehler: ' + err.message, false, 'error'); }
            }
            activeStreamController = null;
            return;
        }

        appendLogLine('Verbunden mit laufendem Hintergrund-Auftrag...');
        activeStreamController = new AbortController();
        const response = await fetch('/job-stream', {signal: activeStreamController.signal});
        if (!response.ok || !response.body) throw new Error(`HTTP ${response.status}`);
        const finished = await consumeEventStream(response);
        activeStreamController = null;
        if (!finished) {
            scheduleReconnect();
        } else if (button) {
            button.disabled = false;
        }
    } catch (err) {
        activeStreamController = null;
        if (err.name === 'AbortError') return;
        const msg = err.message === 'Load failed' || err.message === 'Failed to fetch'
            ? 'Verbindung kurz unterbrochen – verbinde automatisch neu (Auftrag läuft auf dem Server weiter)...'
            : err.message;
        appendLogLine(msg, false, 'error');
        scheduleReconnect();
    }
}

function scheduleReconnect() {
    if (reconnectingTimer) return;
    reconnectingTimer = setTimeout(async () => {
        reconnectingTimer = null;
        try {
            const stRes = await fetch('/job-status', {cache: 'no-store'});
            const st = await stRes.json();
            if (st.running || st.active) {
                await attachToRunningJob(false);
            } else {
                const button = document.getElementById('downloadBtn');
                if (button) button.disabled = false;
                await attachToRunningJob(true);
            }
        } catch (_) {
            scheduleReconnect();
        }
    }, 2000);
}

async function startDownload() {
    if (document.getElementById('destinationFolder') && !window.foldersReady) {
        alert('Bitte erst die Speicherordner laden (Aktualisieren).');
        return;
    }
    const url = document.getElementById('urlInput').value.trim();
    if (!inspectedUrl || url !== inspectedUrl) {alert('Bitte diese URL zuerst erneut prüfen.'); return;}
    const names = Array.from(document.querySelectorAll('.chapter-input'), input => input.value.trim());
    const destEl = document.getElementById('destinationFolder');
    const payload = {
        url,
        title:document.getElementById('titleInput').value.trim(),
        author:document.getElementById('authorInput').value.trim(),
        narrator:document.getElementById('narratorInput').value.trim(),
        series:document.getElementById('seriesInput').value.trim(),
        year:document.getElementById('yearInput').value.trim(),
        description:document.getElementById('descInput').value.trim(),
        cover_url:document.getElementById('coverUrlInput').value.trim(),
        chapters:globalChapters.map((ch, i) => ({...ch, title:names[i]})),
        chapter_names:names,
        destination_folder:destEl ? destEl.value : '',
        is_playlist:globalIsPlaylist
    };
    const button = document.getElementById('downloadBtn');
    button.disabled = true;
    document.getElementById('progressCard').style.display = 'block';
    document.getElementById('progressCard').scrollIntoView({behavior:'smooth'});
    for (const id of ['dl','proc']) setProgress(id, 0);
    const log = document.getElementById('logOutput');
    log.replaceChildren();
    appendLogLine('Starte Download & M4B Generierung (läuft im Hintergrund weiter)...');
    try {
        activeStreamController = new AbortController();
        const response = await fetch('/process', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(payload),
            signal: activeStreamController.signal
        });
        if (!response.ok || !response.body) {
            let errText = `HTTP ${response.status}`;
            try { const errJson = await response.json(); if (errJson.error) errText = errJson.error; } catch (_) {}
            throw new Error(errText);
        }
        const finished = await consumeEventStream(response);
        activeStreamController = null;
        if (!finished) {
            appendLogLine('Browser-Stream unterbrochen – verbinde neu mit Hintergrundprozess...');
            scheduleReconnect();
            return;
        }
        button.disabled = false;
    } catch (err) {
        activeStreamController = null;
        const isDisconnect = err.message === 'Load failed' || err.message === 'Failed to fetch' || err.name === 'TypeError';
        if (isDisconnect) {
            appendLogLine('Browser-Verbindung kurz getrennt (z.B. Refresh / Standby). Auftrag läuft im Hintergrund weiter – verbinde neu...');
            scheduleReconnect();
            return;
        }
        appendLogLine('Fehler: ' + err.message, false, 'error');
        button.disabled = false;
    }
}
function setProgress(id, value) {
    const pct = Math.min(100, Math.max(0, Math.round(Number(value) || 0)));
    document.getElementById(id + 'Bar').style.width = pct + '%';
    document.getElementById(id + 'Percent').innerText = pct + '%';
}
function handleServerMessage(msg) {
    if (typeof msg === 'string') {appendLogLine(msg); return;}
    const text = msg.msg || msg.message;
    const isError = msg.status === 'error' || msg.type === 'error';
    const isDone = msg.status === 'done' || msg.type === 'finished';
    if (text && !isError) {
        if (msg.status === 'downloading' && /Kapitel \d+\s*\//.test(text)) document.getElementById('dlStatusLabel').textContent = text.split('— Gesamt:')[0].trim();
        appendLogLine(text, Boolean(msg.replace_line), isDone ? 'done' : '');
    }
    if (msg.dl_progress !== undefined) {
        setProgress('dl', msg.dl_progress);
    } else if (msg.status === 'downloading') {
        setProgress('dl', msg.progress);
    } else if (msg.type === 'dl_progress') {
        setProgress('dl', msg.percent);
    }
    if (msg.proc_progress !== undefined) {
        setProgress('proc', msg.proc_progress);
    } else if (msg.status === 'processing') {
        setProgress('proc', (Number(msg.progress) - 55) * 100 / 45);
    } else if (msg.type === 'proc_progress') {
        setProgress('proc', msg.percent);
    }
    if (isDone) {setProgress('dl',100); setProgress('proc',100);}
}

// Beim Laden der Seite oder Zurückkehren aus dem Standby (iOS) automatisch laufenden Job wiederaufnehmen
window.addEventListener('DOMContentLoaded', () => {
    attachToRunningJob(true);
});
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !activeStreamController) {
        attachToRunningJob(false);
    }
});
