<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>phantom-rail | Audiobook & M4B Creator</title>
<link rel="icon" type="image/svg+xml" href="/static/pasted.svg">
<style>
:root{--bg-color:#0f172a;--card-bg:#1e293b;--primary:#38bdf8;--primary-hover:#0284c7;--text-main:#f8fafc;--text-muted:#94a3b8;--border:#334155;--success:#22c55e;--danger:#ef4444}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg-color);color:var(--text-main);margin:0;padding:16px;display:flex;justify-content:center}.container{width:100%;max-width:800px;display:flex;flex-direction:column;gap:16px}.card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 4px 6px -1px rgba(0,0,0,.3)}.header-title{display:flex;align-items:center;gap:14px;margin-bottom:8px}.brand-logo{width:52px;height:52px;object-fit:contain;border-radius:8px;flex-shrink:0}.brand-text{display:flex;flex-direction:column;gap:2px}.brand-name{font-size:1.8rem;font-weight:800;letter-spacing:-.02em;color:var(--primary)}.brand-subtitle{font-size:.95rem;color:var(--text-muted);font-weight:500}h1,h2,h3{margin-top:0;color:var(--primary)}.input-group{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}label{font-size:.85rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}input[type="text"],input[type="url"],textarea{width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:#0f172a;color:var(--text-main);font-size:1rem;box-sizing:border-box}input:focus,textarea:focus{outline:none;border-color:var(--primary)}button{background:var(--primary);color:#0f172a;border:none;border-radius:8px;padding:12px 18px;font-size:1rem;font-weight:bold;cursor:pointer;width:100%}button:hover{background:var(--primary-hover)}button:disabled{background:var(--border);color:var(--text-muted);cursor:not-allowed}.cover-preview-wrapper{display:flex;justify-content:center;margin:12px 0}.cover-preview{max-width:220px;max-height:220px;width:auto;height:auto;border-radius:8px;border:1px solid var(--border);object-fit:contain;background:#000}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid-2{grid-template-columns:1fr}}.chapter-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:#0f172a;padding:8px;border-radius:6px;border:1px solid var(--border)}.chapter-num{min-width:32px;text-align:center;font-weight:bold;color:var(--text-muted);font-size:.85rem}.chapter-item input{flex-grow:1;padding:8px;font-size:.95rem;background:#1e293b;border:1px solid var(--border)}.batch-toolbar{background:#0b1329;border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}.batch-row{display:flex;gap:8px;flex-wrap:wrap}.btn-small{padding:8px 12px;font-size:.85rem;width:auto;background:#334155;color:var(--text-main)}.btn-small:hover{background:#475569}.progress-box{display:flex;flex-direction:column;gap:8px;margin-top:12px}.progress-bar-container{width:100%;height:12px;background:#0f172a;border-radius:6px;overflow:hidden;border:1px solid var(--border)}.progress-bar{height:100%;width:0%;background:var(--primary);transition:width .3s ease}.progress-label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--text-muted)}#logOutput{background:#000;color:#38bdf8;font-family:monospace;font-size:.85rem;padding:12px;border-radius:8px;height:160px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;border:1px solid var(--border);margin-top:10px}.log-line{line-height:1.45;margin-bottom:2px}.log-line.error{color:var(--danger);font-weight:bold}.log-line.done{color:var(--success);font-weight:bold}

/* === ORDNER-REITER (TABS) & iOS OPTIMIERUNG === */
#folderTabs, #folder-tabs, .folder-tabs {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 8px !important;
    max-height: 220px;
    overflow-y: auto;
    padding: 10px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid #334155;
    border-radius: 10px;
    margin-bottom: 12px;
    -webkit-overflow-scrolling: touch;
}

button.folder-tab, .folder-tab {
    width: auto !important;
    flex: 0 1 auto !important;
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    padding: 8px 14px !important;
    margin: 0 !important;
    font-size: 14px !important;
    font-weight: 500 !important;
    border-radius: 20px !important;
    background-color: #1e293b !important;
    color: #cbd5e1 !important;
    border: 1px solid #475569 !important;
    cursor: pointer;
    transition: all 0.2s ease;
}

button.folder-tab:hover, .folder-tab:hover {
    background-color: #334155 !important;
    border-color: #38bdf8 !important;
    color: #fff !important;
    transform: translateY(-1px);
}

button.folder-tab.active, .folder-tab.active {
    background-color: #0284c7 !important;
    border-color: #38bdf8 !important;
    color: #fff !important;
}

@media (max-width: 600px) {
    #folderTabs, #folder-tabs, .folder-tabs {
        max-height: 180px;
        gap: 6px !important;
        padding: 8px;
    }
    button.folder-tab, .folder-tab {
        padding: 7px 11px !important;
        font-size: 13px !important;
    }
}

/* iOS Safari viewport and touch improvements */
html {
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
}

body {
    min-height: 100vh;
    min-height: -webkit-fill-available;
}

input, textarea, select, button {
    font-size: 16px !important; /* prevents iOS zoom on focus */
}

button, .folder-tab, .btn-small {
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
}

/* Smooth scrolling on mobile */
#logOutput, #chapterList, .folder-tabs {
    -webkit-overflow-scrolling: touch;
}

/* === MOBILE TAB BAR === */
.mobile-tabs { display:none; }
@media (max-width: 600px) {
    .mobile-tabs {
        display: flex;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1000;
        background: #0f172a;
        border-top: 1px solid #334155;
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        gap: 8px;
    }
    .mobile-tabs button {
        flex: 1;
        width: auto;
        padding: 10px 6px;
        font-size: 13px !important;
    }
    body { padding-bottom: calc(82px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="header-title">
      <img src="/static/pasted.svg" class="brand-logo" alt="Phantom Rail">
      <div class="brand-text"><div class="brand-name">Phantom Rail</div><div class="brand-subtitle">Audiobook & M4B Creator</div></div>
    </div>
  </div>
  <div class="card">
    <h2>Video / Audio URL</h2>
    <div class="input-group"><label for="urlInput">URL</label><input type="url" id="urlInput" placeholder="https://..."></div>
    <button type="button" id="inspectBtn" onclick="inspectUrl()">Prüfen</button>
    <div id="inspectStatus"></div>
  </div>
  <div class="card" id="detailsCard" style="display:none">
    <h2>Details</h2>
    <div class="grid-2">
      <div class="input-group"><label for="titleInput">Titel</label><input type="text" id="titleInput"></div>
      <div class="input-group"><label for="authorInput">Autor</label><input type="text" id="authorInput"></div>
      <div class="input-group"><label for="narratorInput">Sprecher</label><input type="text" id="narratorInput"></div>
      <div class="input-group"><label for="seriesInput">Serie</label><input type="text" id="seriesInput"></div>
      <div class="input-group"><label for="yearInput">Jahr</label><input type="text" id="yearInput"></div>
      <div class="input-group"><label for="coverUrlInput">Cover URL</label><input type="url" id="coverUrlInput"></div>
    </div>
    <div class="input-group"><label for="descInput">Beschreibung</label><textarea id="descInput"></textarea></div>
    <div id="coverPreview"></div>
    <div id="chapterList"></div>
    <button id="downloadBtn">Download</button>
  </div>
  <div class="card" id="folderCard">
    <h2>Speicherordner</h2>
    <div id="folderTabs" class="folder-tabs"></div>
    <div id="destinationFolderWrap"><select id="destinationFolder"></select></div>
    <button type="button" onclick="loadFolders()">Ordner laden</button>
  </div>
  <div class="card" id="progressCard" style="display:none">
    <h2>Fortschritt</h2>
    <div class="progress-box"><div class="progress-label"><span id="dlStatusLabel">Download</span><span id="dlPercent">0%</span></div><div class="progress-bar-container"><div id="dlBar" class="progress-bar"></div></div></div>
    <div class="progress-box"><div class="progress-label"><span>Verarbeitung</span><span id="procPercent">0%</span></div><div class="progress-bar-container"><div id="procBar" class="progress-bar"></div></div></div>
    <button type="button" id="cancelBtn" style="display:none" onclick="cancelJob()">Abbrechen</button>
    <div id="logOutput"></div>
  </div>
</div>
<div class="mobile-tabs">
  <button type="button" onclick="document.getElementById('detailsCard').scrollIntoView({behavior:'smooth'})">Details</button>
  <button type="button" onclick="document.getElementById('folderCard').scrollIntoView({behavior:'smooth'})">Ordner</button>
  <button type="button" onclick="document.getElementById('progressCard').scrollIntoView({behavior:'smooth'})">Fortschritt</button>
</div>
<div id="nextoryModal" style="display:none">
  <div id="nextoryAuth" style="display:none"><input id="nextoryEmail"><input id="nextoryPassword" type="password"><select id="nextoryCountry"></select><button onclick="nextoryLogin()">Login</button></div>
  <div id="nextoryProfileWrap" style="display:none"><select id="nextoryProfile"></select><button onclick="selectNextoryProfile()">Profil</button></div>
  <div id="nextoryBrowser" style="display:none"><input id="nextorySearch"><button onclick="searchNextory()">Suchen</button><div id="nextoryResults"></div></div>
  <div id="nextoryMessage"></div>
  <button type="button" onclick="closeNextory()">Schließen</button>
</div>
<script>
let inspectedUrl = null;
let globalChapters = [];
let globalIsPlaylist = false;
let activeStreamController = null;
let reconnectingTimer = null;
let lastDownloadPct = 0;

function appendLogLine(text, scroll = true, css = '') {
    const box = document.getElementById('logOutput');
    if (!box) return;
    const line = document.createElement('div');
    line.className = 'log-line' + (css ? ' ' + css : '');
    line.textContent = text;
    box.appendChild(line);
    if (scroll) box.scrollTop = box.scrollHeight;
}

function setCancelButtonVisible(visible) {
    const btn = document.getElementById('cancelBtn');
    if (btn) btn.style.display = visible ? 'block' : 'none';
}

async function consumeEventStream(response) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let finished = false;
    try {
        while (true) {
            const {value, done} = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, {stream:true});
            const chunks = buffer.split('\n\n');
            buffer = chunks.pop() || '';
            for (const chunk of chunks) {
                const line = chunk.split('\n').find(part => part.startsWith('data: '));
                if (!line) continue;
                let data;
                try { data = JSON.parse(line.slice(6)); } catch (_) { continue; }
                if (data && (data.status === 'done' || data.status === 'error' || data.status === 'cancelled' || data.type === 'finished')) finished = true;
                handleServerMessage(data);
            }
        }
    } finally {
        reader.releaseLock();
    }
    return finished;
}

async function attachToRunningJob(isInitialPageLoad = false) {
    if (activeStreamController) return;
    try {
        const stRes = await fetch('/job-status', {cache: 'no-store'});
        if (!stRes.ok) return;
        const st = await stRes.json();
        const isRunning = Boolean(st.running || st.active);
        const hasEvents = (typeof st.event_count === 'number') ? st.event_count > 0 : true;
        if (!isRunning && (!isInitialPageLoad || st.status === 'idle' || !hasEvents)) return;

        const button = document.getElementById('downloadBtn');
        if (button) button.disabled = Boolean(st.running);
        setCancelButtonVisible(Boolean(st.running));
        document.getElementById('progressCard').style.display = 'block';
        const log = document.getElementById('logOutput');
        log.replaceChildren();

        if (!st.running) {
            // Letzten abgeschlossenen/fehlgeschlagenen Job anzeigen
            activeStreamController = new AbortController();
            const response = await fetch('/job-stream', {signal: activeStreamController.signal});
            if (response.ok && response.body) {
                try { await consumeEventStream(response); } catch (err) { appendLogLine('Fehler: ' + err.message, false, 'error'); }
            }
            activeStreamController = null;
            setCancelButtonVisible(false);
            return;
        }

        appendLogLine('Verbunden mit laufendem Hintergrund-Auftrag...');
        activeStreamController = new AbortController();
        const response = await fetch('/job-stream', {signal: activeStreamController.signal});
        if (!response.ok || !response.body) throw new Error(`HTTP ${response.status}`);
        const finished = await consumeEventStream(response);
        activeStreamController = null;
        if (!finished) {
            scheduleReconnect();
        } else {
            if (button) button.disabled = false;
            setCancelButtonVisible(false);
        }
    } catch (err) {
        activeStreamController = null;
        if (err.name === 'AbortError') return;
        const msg = err.message === 'Load failed' || err.message === 'Failed to fetch'
            ? 'Verbindung kurz unterbrochen – verbinde automatisch neu (Auftrag läuft auf dem Server weiter)...'
            : err.message;
        appendLogLine(msg, false, 'error');
        scheduleReconnect();
    }
}

function scheduleReconnect() {
    if (reconnectingTimer) return;
    reconnectingTimer = setTimeout(async () => {
        reconnectingTimer = null;
        try {
            const stRes = await fetch('/job-status', {cache: 'no-store'});
            const st = await stRes.json();
            if (st.running || st.active) {
                await attachToRunningJob(false);
            } else {
                const button = document.getElementById('downloadBtn');
                if (button) button.disabled = false;
                setCancelButtonVisible(false);
                await attachToRunningJob(true);
            }
        } catch (_) {
            scheduleReconnect();
        }
    }, 2000);
}

async function startDownload() {
    if (document.getElementById('destinationFolder') && !window.foldersReady) {
        alert('Bitte erst die Speicherordner laden (Aktualisieren).');
        return;
    }
    const url = document.getElementById('urlInput').value.trim();
    if (!inspectedUrl || url !== inspectedUrl) {alert('Bitte diese URL zuerst erneut prüfen.'); return;}
    const names = Array.from(document.querySelectorAll('.chapter-input'), input => input.value.trim());
    const destEl = document.getElementById('destinationFolder');
    const payload = {
        url,
        title:document.getElementById('titleInput').value.trim(),
        author:document.getElementById('authorInput').value.trim(),
        narrator:document.getElementById('narratorInput').value.trim(),
        series:document.getElementById('seriesInput').value.trim(),
        year:document.getElementById('yearInput').value.trim(),
        description:document.getElementById('descInput').value.trim(),
        cover_url:document.getElementById('coverUrlInput').value.trim(),
        chapters:globalChapters.map((ch, i) => ({...ch, title:names[i]})),
        chapter_names:names,
        destination_folder:destEl ? destEl.value : '',
        is_playlist:globalIsPlaylist
    };
    const button = document.getElementById('downloadBtn');
    button.disabled = true;
    lastDownloadPct = 0;
    setCancelButtonVisible(true);
    document.getElementById('progressCard').style.display = 'block';
    document.getElementById('progressCard').scrollIntoView({behavior:'smooth'});
    for (const id of ['dl','proc']) setProgress(id, 0);
    const log = document.getElementById('logOutput');
    log.replaceChildren();
    appendLogLine('Starte Download & M4B Generierung (läuft im Hintergrund weiter)...');
    try {
        activeStreamController = new AbortController();
        const response = await fetch('/process', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(payload),
            signal: activeStreamController.signal
        });
        if (!response.ok || !response.body) {
            let errText = `HTTP ${response.status}`;
            try { const errJson = await response.json(); if (errJson.error) errText = errJson.error; } catch (_) {}
            throw new Error(errText);
        }
        const finished = await consumeEventStream(response);
        activeStreamController = null;
        if (!finished) {
            appendLogLine('Browser-Stream unterbrochen – verbinde neu mit Hintergrundprozess...');
            scheduleReconnect();
            return;
        }
        button.disabled = false;
        setCancelButtonVisible(false);
    } catch (err) {
        activeStreamController = null;
        const isDisconnect = err.message === 'Load failed' || err.message === 'Failed to fetch' || err.name === 'TypeError';
        if (isDisconnect) {
            appendLogLine('Browser-Verbindung kurz getrennt (z.B. Refresh / Standby). Auftrag läuft im Hintergrund weiter – verbinde neu...');
            scheduleReconnect();
            return;
        }
        appendLogLine('Fehler: ' + err.message, false, 'error');
        button.disabled = false;
        setCancelButtonVisible(false);
    }
}
function setProgress(id, value) {
    let pct = Math.min(100, Math.max(0, Math.round(Number(value) || 0)));
    if (id === 'dl') {
        if (pct < lastDownloadPct && pct < 100) {
            pct = lastDownloadPct;
        } else {
            lastDownloadPct = pct;
        }
    }
    document.getElementById(id + 'Bar').style.width = pct + '%';
    document.getElementById(id + 'Percent').innerText = pct + '%';
}
function handleServerMessage(msg) {
    if (typeof msg === 'string') {appendLogLine(msg); return;}
    const text = msg.msg || msg.message;
    const isError = msg.status === 'error' || msg.type === 'error';
    const isDone = msg.status === 'done' || msg.type === 'finished';
    const isCancelled = msg.status === 'cancelled';

    if (text && !isError) {
        if (msg.status === 'downloading' && /Kapitel \d+\s*\//.test(text)) {
            document.getElementById('dlStatusLabel').textContent = text.split('— Gesamt:')[0].trim();
        }
        let css = '';
        if (isDone) css = 'done';
        if (isCancelled) css = 'error';
        appendLogLine(text, true, css);
    } else if (text) {
        appendLogLine(text, true, 'error');
    }
    if (msg.status === 'progress') {
        if (msg.step === 'download' && msg.percent !== undefined) setProgress('dl', msg.percent);
        if (msg.step === 'process' && msg.percent !== undefined) setProgress('proc', msg.percent);
    }
    if (isDone || isError || isCancelled) {
        const button = document.getElementById('downloadBtn');
        if (button) button.disabled = false;
        setCancelButtonVisible(false);
    }
}

async function inspectUrl() {
    const url = document.getElementById('urlInput').value.trim();
    const status = document.getElementById('inspectStatus');
    status.textContent = 'Prüfe...';
    try {
        const response = await fetch('/inspect', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Fehler');
        inspectedUrl = url;
        globalChapters = data.chapters || [];
        globalIsPlaylist = Boolean(data.is_playlist);
        document.getElementById('titleInput').value = data.title || '';
        document.getElementById('authorInput').value = data.author || '';
        document.getElementById('narratorInput').value = data.narrator || '';
        document.getElementById('seriesInput').value = data.series || '';
        document.getElementById('yearInput').value = data.year || '';
        document.getElementById('descInput').value = data.description || '';
        document.getElementById('coverUrlInput').value = data.cover_url || '';
        const chapterList = document.getElementById('chapterList');
        chapterList.replaceChildren();
        globalChapters.forEach((chapter, index) => {
            const row = document.createElement('div');
            const number = document.createElement('span');
            const input = document.createElement('input');
            row.className = 'chapter-item';
            number.className = 'chapter-num';
            number.textContent = index + 1;
            input.className = 'chapter-input';
            input.value = chapter.title || `Chapter ${index + 1}`;
            row.append(number, input);
            chapterList.append(row);
        });
        document.getElementById('detailsCard').style.display = 'block';
        status.textContent = 'Details geladen';
    } catch (error) { status.textContent = 'Fehler: ' + error.message; }
}

async function cancelJob() {
    try {
        await fetch('/cancel', {method:'POST'});
    } catch (_) {}
}

function loadFolders() {
    const status = document.getElementById('folderTabs');
    status.textContent = 'Lade Ordner...';
}

window.addEventListener('load', () => {
    if (window.foldersReady) loadFolders();
    attachToRunningJob(true);
});
</script>
<script src="/static/folders.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const api = '/api/nextory';
  async function call(path, opts = {}) {
    const response = await fetch(api + path, {
      headers: { 'Content-Type': 'application/json' }, ...opts
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Request failed');
    return data;
  }
  function message(text = '') { $('nextoryMessage').textContent = text; }
  window.openNextory = async () => {
    $('nextoryModal').style.display = 'block';
    message('');
    try {
      const status = await call('/status');
      $('nextoryAuth').style.display = status.profile_selected ? 'none' : 'block';
      $('nextoryBrowser').style.display = status.profile_selected ? 'block' : 'none';
    } catch (error) { message(error.message); }
  };
  window.closeNextory = () => { $('nextoryModal').style.display = 'none'; };
  window.nextoryLogin = async () => {
    try {
      const data = await call('/login', {
        method: 'POST', body: JSON.stringify({
          username: $('nextoryEmail').value,
          password: $('nextoryPassword').value,
          country: $('nextoryCountry').value
        })
      });
      if (data.profile_required || (data.profiles || []).length > 1) {
        $('nextoryProfile').replaceChildren(...data.profiles.map(profile => {
          const option = document.createElement('option');
          option.value = profile.login_key;
          option.textContent = profile.name || profile.login_key;
          return option;
        }));
        $('nextoryProfileWrap').style.display = 'block';
      } else {
        $('nextoryBrowser').style.display = 'block';
        message('Login erfolgreich');
      }
    } catch (error) { message(error.message); }
  };
  window.selectNextoryProfile = async () => {
    try {
      await call('/profile', { method: 'POST', body: JSON.stringify({ profile: $('nextoryProfile').value }) });
      $('nextoryProfileWrap').style.display = 'none';
      $('nextoryBrowser').style.display = 'block';
      message('Profil ausgewählt');
    } catch (error) { message(error.message); }
  };
  window.searchNextory = async () => {
    const query = $('nextorySearch').value.trim();
    if (!query) return;
    message('Suche läuft...');
    try {
      const data = await call('/search', { method: 'POST', body: JSON.stringify({ query }) });
      const results = $('nextoryResults');
      results.replaceChildren(...data.books.map(book => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = `${book.title} — ${book.author || 'Unbekannter Autor'}`;
        button.onclick = () => selectNextoryBook(book.id);
        return button;
      }));
      message(`${data.books.length} Treffer`);
    } catch (error) { message(error.message); }
  };
  async function selectNextoryBook(id) {
    message('Lade Buchdetails...');
    try {
      const data = await call('/book/' + encodeURIComponent(id));
      const book = data.book;
      $('titleInput').value = book.title || '';
      $('authorInput').value = book.author || '';
      $('narratorInput').value = book.narrator || '';
      $('seriesInput').value = book.series || '';
      $('yearInput').value = book.year || '';
      $('descInput').value = book.description || '';
      if ($('coverUrlInput')) {
        $('coverUrlInput').value = book.cover_url || '';
        if (typeof updateCoverPreview === 'function') updateCoverPreview();
      }
      const chapterList = $('chapterList');
      chapterList.replaceChildren();
      data.chapters.forEach((chapter, index) => {
        const row = document.createElement('div');
        const number = document.createElement('span');
        const input = document.createElement('input');
        row.className = 'chapter-item';
        number.className = 'chapter-num';
        number.textContent = index + 1;
        input.className = 'chapter-input';
        input.value = chapter.title || `Chapter ${index + 1}`;
        row.append(number, input);
        chapterList.append(row);
      });
      $('detailsCard').style.display = 'block';
      $('detailsCard').scrollIntoView({ behavior: 'smooth' });
      closeNextory();
      $('downloadBtn').onclick = () => downloadBook(id, data.chapters);
    } catch (error) { message(error.message); }
  }
  async function downloadBook(id, chapters) {
    if (activeStreamController) { alert('Ein Auftrag läuft bereits.'); return; }
    if ($('destinationFolder') && !window.foldersReady) {
      alert('Bitte erst die Speicherordner laden (Aktualisieren).'); return;
    }
    const button = $('downloadBtn');
    button.disabled = true;
    lastDownloadPct = 0;
    $('progressCard').style.display = 'block';
    $('progressCard').scrollIntoView({ behavior: 'smooth' });
    for (const name of ['dl', 'proc']) setProgress(name, 0);
    $('logOutput').replaceChildren();
    appendLogLine('Starte Nextory-Download …');
    try {
      activeStreamController = new AbortController();
      const response = await fetch(api + '/download', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        signal: activeStreamController.signal,
        body: JSON.stringify({
          book_id: id, title: $('titleInput').value.trim(),
          author: $('authorInput').value.trim(), narrator: $('narratorInput').value.trim(),
          chapters: chapters.map((chapter, index) => ({
            ...chapter, title: document.querySelectorAll('.chapter-input')[index]?.value || chapter.title
          })),
          destination_folder: $('destinationFolder')?.value || ''
        })
      });
      if (!response.ok || !response.body) {
        let error = `HTTP ${response.status}`;
        try { error = (await response.json()).error || error; } catch (_) {}
        throw new Error(error);
      }
      const finished = await consumeEventStream(response);
      activeStreamController = null;
      if (!finished) scheduleReconnect();
    } catch (error) {
      activeStreamController = null;
      const isDisconnect = error.message === 'Load failed' || error.message === 'Failed to fetch' || error.name === 'TypeError';
      if (isDisconnect) {
        appendLogLine('Browser-Verbindung kurz getrennt (z.B. Refresh / Standby). Auftrag läuft im Hintergrund weiter – verbinde neu...');
        scheduleReconnect();
        return;
      }
      appendLogLine('Fehler: ' + error.message, false, 'error');
    } finally { if (!reconnectingTimer) button.disabled = false; }
  }
  window.nextoryLogout = async () => {
    try {
      await call('/logout', { method: 'POST' });
      $('nextoryAuth').style.display = 'block';
      $('nextoryBrowser').style.display = 'none';
      $('nextoryResults').replaceChildren();
      message('');
    } catch (error) { message(error.message); }
  };
})();
</script>
</body>
</html>
